server {
    listen 80;
    server_name www.vulkanspielepoland.pl;
    return 301 https://vulkanspielepoland.pl$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # 301 redirect /bonus-bez-depozytu/ -> /bonus/ (consolidated page)
    location ~ ^/bonus-bez-depozytu(/.*)?$ {
        return 301 /bonus/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
